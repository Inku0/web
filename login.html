<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
  </head>
  <body>
    <header>
      <nav>
        <ul class="navbar-links">
          <li><a href="index.html">Home</a></li>
        </ul>
        <div class="navbar-pfp">
          <a href="login.html" id="userPfpLink">
            <img class="user-pfp" id="userPfp" alt="User's profile picture" src="res/images/me.svg">
          </a>
          <div class="dropdown-menu" id="dropdownMenu">
            <p class="user-name" id="dropdownName"></p>
            <p class="user-email" id="dropdownEmail"> </p>
            <a href="#" class="logout-button" id="logoutButton">Logout</a>
          </div>
        </div>
      </nav>
    </header>
    <form action="index.html" method="POST" id="loginForm">
      <div class ="container">
        <h1> Welcome to PostIt</h1>
        <a href="#">Create an account</a>
        <p> or <br> Please log in  </p>
        <label>
          <input type="text" placeholder="Email" name="Email" id="emailInput" required>
        </label>

        <label>
          <input type="text" placeholder="Password" name="Password" required>
        </label>

        <button type="submit">Log in</button>
        <a href="#">Forgot password</a>
      </div>
    </form>
    <script src="account.js"></script>
  </body>
</html>
